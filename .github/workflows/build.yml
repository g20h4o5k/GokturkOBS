name: Build and Release GokturkOBS (unsigned)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - '**/*.txt'
      - '**/*.pdf'
      - '**/.DS_Store'
      - 'LICENSE*'
      - 'docs/**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: gokturkobs-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove missing legacy resources from project
        run: |
          python3 - <<'PY'
          from pathlib import Path
          project = Path("GokturkOBS.xcodeproj/project.pbxproj")
          lines = project.read_text().splitlines(keepends=True)
          missing = ("TARAMALAR-API.md", "LimeOBS_Temiz_Dagitim.zip")
          lines = [line for line in lines if not any(name in line for name in missing)]
          project.write_text("".join(lines))
          PY

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build unsigned macOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project GokturkOBS.xcodeproj \
            -scheme GokturkOBS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/GokturkOBS-build" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create DMG installer
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/GokturkOBS-build/Build/Products/Release/GokturkOBS.app"
          STAGING="$RUNNER_TEMP/GokturkOBS-dmg"
          DMG="$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg"
          test -d "$APP"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/GokturkOBS.app"
          ln -s /Applications "$STAGING/Applications"
          hdiutil create -volname "GokturkOBS" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: GokturkOBS-macOS-unsigned-DMG
          path: ${{ runner.temp }}/GokturkOBS-macOS-unsigned.dmg
          if-no-files-found: error
          retention-days: 14


  release:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download built DMG
        uses: actions/download-artifact@v4
        with:
          name: GokturkOBS-macOS-unsigned-DMG
          path: ${{ runner.temp }}

      - name: Determine automatic version
        id: version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags
          LAST_TAG="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [ -z "$LAST_TAG" ]; then
            LAST_TAG="v1.0.0"
            CHANGED=0
          else
            CHANGED="$(git diff --numstat "$LAST_TAG" HEAD -- '*.swift' '*.m' '*.mm' '*.h' '*.c' '*.cpp' '*.metal' '*.plist' '*.pbxproj' | awk '{if ($1 ~ /^[0-9]+$/) a+=$1; if ($2 ~ /^[0-9]+$/) d+=$2} END {print a+d+0}')"
          fi
          IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
          if [ "$CHANGED" -ge 1000 ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "tag=v$MAJOR.$MINOR.$PATCH" >> "$GITHUB_OUTPUT"
          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Publish automatic GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" "$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg" \
            --target "$GITHUB_SHA" \
            --title "GokturkOBS $TAG" \
            --generate-notes

      - name: Publish manually tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg" --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/GokturkOBS-macOS-unsigned.dmg" \
              --title "GokturkOBS $TAG" \
              --generate-notes \
              --verify-tag
          fi
